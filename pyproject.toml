[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connoisseur"
version = "0.1.0"
description = "Multimodal restaurant/recipe pipeline, RAG, multi-agent system and MCP assistant (DeepSeek-powered)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Module 2: embeddings + vector search (large: pulls in torch)
rag = [
    "torch",
    "transformers",
    "sentence-transformers>=2.7",
    "chromadb",
]
# Module 3: multi-agent workflow + Gradio chatbot
agents = [
    "langchain-core",
    "langchain-openai",
    "gradio>=5,<6",
]
# Module 4: MCP server, client and agent app
mcp = [
    "fastmcp",
    "mcp",
    "anthropic",
    "langchain-core",
    "langchain-openai",
    "gradio>=5,<6",
]
dev = ["pytest"]
all = ["connoisseur[rag,agents,mcp]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
